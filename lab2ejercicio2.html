<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 2 - Galería Rick and Morty</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: #1e1e1e;
            color: white;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            padding: 40px 0;
            background: linear-gradient(135deg, #00b5cc 0%, #97ce4c 100%);
            border-radius: 20px;
            margin-bottom: 30px;
        }
        h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }
        .filtros {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            background: #2a2a2a;
            padding: 20px;
            border-radius: 10px;
        }
        input, select, button {
            padding: 12px 20px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
        }
        input {
            flex: 1;
            min-width: 250px;
            background: #3a3a3a;
            color: white;
        }
        select {
            background: #3a3a3a;
            color: white;
            cursor: pointer;
        }
        button {
            background: #97ce4c;
            color: #1e1e1e;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        button:hover {
            background: #7ab83c;
            transform: scale(1.05);
        }
        #galeria {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .personaje {
            background: #2a2a2a;
            border-radius: 15px;
            overflow: hidden;
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
        }
        .personaje:hover {
            transform: translateY(-10px);
            box-shadow: 0 10px 30px rgba(151, 206, 76, 0.3);
        }
        .personaje img {
            width: 100%;
            height: 250px;
            object-fit: cover;
        }
        .personaje-info {
            padding: 15px;
        }
        .personaje-info h3 {
            margin-bottom: 10px;
            color: #97ce4c;
        }
        .personaje-info p {
            margin: 5px 0;
            font-size: 14px;
            color: #ccc;
        }
        .status {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
            margin-top: 8px;
        }
        .status.alive { background: #55cc44; color: white; }
        .status.dead { background: #d63d2e; color: white; }
        .status.unknown { background: #9e9e9e; color: white; }
        .loading {
            text-align: center;
            padding: 60px;
            font-size: 20px;
            color: #97ce4c;
        }
        .error {
            text-align: center;
            padding: 40px;
            background: #d63d2e;
            border-radius: 10px;
            margin: 20px 0;
        }
        .no-results {
            text-align: center;
            padding: 60px;
            font-size: 18px;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🛸 Rick and Morty</h1>
            <p>Galería de Personajes</p>
        </header>

        <div class="filtros">
            <input type="text" id="nombreInput" placeholder="Buscar por nombre...">
            <select id="estadoSelect">
                <option value="">Todos los estados</option>
                <option value="alive">Vivos</option>
                <option value="dead">Muertos</option>
                <option value="unknown">Desconocido</option>
            </select>
            <select id="generoSelect">
                <option value="">Todos los géneros</option>
                <option value="male">Masculino</option>
                <option value="female">Femenino</option>
                <option value="genderless">Sin género</option>
                <option value="unknown">Desconocido</option>
            </select>
            <button id="buscarBtn">🔍 Buscar</button>
            <button id="limpiarBtn" style="background: #d63d2e;">🗑️ Limpiar</button>
        </div>

        <div id="galeria"></div>
    </div>

    <script>
        const buscarBtn = document.getElementById('buscarBtn');
        const limpiarBtn = document.getElementById('limpiarBtn');
        const nombreInput = document.getElementById('nombreInput');
        const estadoSelect = document.getElementById('estadoSelect');
        const generoSelect = document.getElementById('generoSelect');
        const galeriaDiv = document.getElementById('galeria');

        buscarBtn.addEventListener('click', buscarPersonajes);
        limpiarBtn.addEventListener('click', limpiarFiltros);
        nombreInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') buscarPersonajes();
        });

        // Cargar personajes al inicio
        window.addEventListener('load', () => buscarPersonajes());

        // TU CÓDIGO AQUÍ
        // Implementa las funciones usando async/await

        async function buscarPersonajes() {
            // Paso 1: Mostrar loading
            galeriaDiv.innerHTML = '<div class="loading">⏳ Cargando personajes...</div>';
            
            // Paso 2: Obtener los valores de los filtros
            const nombre = nombreInput.value.trim();
            const estado = estadoSelect.value;
            const genero = generoSelect.value;
            
            // Paso 3: Construir la URL con parámetros
            // Base: https://rickandmortyapi.com/api/character
            // Con filtros: https://rickandmortyapi.com/api/character?name=rick&status=alive&gender=male
            // Usa URLSearchParams o construye manualmente
            let url = "https://rickandmortyapi.com/api/character";

            const params = new URLSearchParams();
            //agregamos parametros solo si son seleccionados
            if(nombre) params.append('name', nombre);
            if(estado) params.append('status', estado);
            if(genero) params.append('gender', genero);
            
            //si hay parametros lo agregamos a la url
            if(params){
                url+= `?${params}`;
            }
            console.log(url)
            
            try {
                // Paso 4: Hacer fetch con await
                const respuesta = await fetch(url);
                // Paso 5: Verificar respuesta.ok
                if(!respuesta.ok){
                    if(respuesta.status === 404){
                        mostrarPersonajes([]);//galeria vacia
                        return;
                    }
                throw new Error(`Error en la solicitud: HTTP ${respuesta.status}`);
                }
                // Paso 6: Convertir a JSON con await
                const datos = await respuesta.json();
                // Paso 7: Extraer el array de personajes (datos.results)
                //const personaje = datos.results[0];
                const personajes = datos.results;
                // Paso 8: Llamar a mostrarPersonajes(personajes)
                mostrarPersonajes(personajes);
                
            } catch (error) {
                // Paso 9: Manejar errores
                galeriaDiv.innerHTML = `
                    <div class="error">
                        <h3>❌ Error</h3>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        }

        function mostrarPersonajes(personajes) {
            if (personajes.length === 0) {
                galeriaDiv.innerHTML = '<div class="no-results">😕 No se encontraron personajes</div>';
                return;
            }

            const html = personajes.map(personaje => `
                <div class="personaje">
                    <img src="${personaje.image}" alt="${personaje.name}">
                    <div class="personaje-info">
                        <h3>${personaje.name}</h3>
                        <p><strong>Especie:</strong> ${personaje.species}</p>
                        <p><strong>Género:</strong> ${personaje.gender}</p>
                        <p><strong>Origen:</strong> ${personaje.origin.name}</p>
                        <span class="status ${personaje.status.toLowerCase()}">
                            ${personaje.status === 'Alive' ? '🟢' : personaje.status === 'Dead' ? '🔴' : '⚫'} 
                            ${personaje.status}
                        </span>
                    </div>
                </div>
            `).join('');

            galeriaDiv.innerHTML = html;
        }

        function limpiarFiltros() {
            nombreInput.value = '';
            estadoSelect.value = '';
            generoSelect.value = '';
            buscarPersonajes();
        }
    </script>
</body>
</html>
